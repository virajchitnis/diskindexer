# XcodeGen spec for the Xcode project used to run the XCUITest end-to-end
# tests (UI tests can't live in a Swift package), and for the iPhone/iPad app,
# which needs an app target to be installed on a device. Generate with:
#   cd apple/Xcode && xcodegen generate
# The .xcodeproj is generated, not committed. The shipping app is still built
# by `make mac-app` from the Swift package; this project shares its sources.
name: DiskIndexer
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DiskIndexerPackage:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Ad-hoc signing: runs on any Mac, including CI, without a team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  DiskIndexer:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/DiskIndexerMac
    dependencies:
      - package: DiskIndexerPackage
        product: DiskIndexerKit
    settings:
      base:
        # Separate from the real app, so tests never touch its settings.
        PRODUCT_BUNDLE_IDENTIFIER: com.virajchitnis.diskindexer.e2e
        PRODUCT_NAME: DiskIndexer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DiskIndexer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  DiskIndexerIOS:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/DiskIndexerIOS
      # Its AppIcon.png is copied in by `make ios-ipa` (see the Makefile).
      - path: iOSAssets.xcassets
    dependencies:
      - package: DiskIndexerPackage
        product: DiskIndexerKit
      - package: DiskIndexerPackage
        product: DiskIndexerSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.virajchitnis.diskindexer.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: DiskIndexer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DiskIndexer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: DiskIndexer connects to your server over SSH.
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  DiskIndexerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../UITests
    dependencies:
      - target: DiskIndexer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.virajchitnis.diskindexer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DiskIndexer
schemes:
  DiskIndexer:
    build:
      targets:
        DiskIndexer: all
        DiskIndexerUITests: [test]
    test:
      targets:
        - DiskIndexerUITests
  DiskIndexerIOS:
    build:
      targets:
        DiskIndexerIOS: all
