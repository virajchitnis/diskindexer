name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # Fails below 80% (COVERAGE_MIN), counted across all packages.
      - run: make coverage-go
      - name: Cross-compile release binaries
        run: make build-linux build-darwin-arm64 build-darwin-amd64

  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version stamped into the app
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: swift --version
      # Unit and AppModel integration tests (against a real `diskindexer
      # serve`), with coverage; fails below 80% for the app logic.
      - run: make coverage-apple
      # Builds the .app, its zip, and the drag-to-install DMG.
      - run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DiskIndexer-macOS
          path: |
            build/DiskIndexer-macOS.zip
            build/DiskIndexer.dmg
          if-no-files-found: error

  ui-tests:
    name: macOS UI tests (XCUITest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install xcodegen
      # The app runs this binary in local mode; the tests use it to index fixtures.
      - run: make build
      - name: Generate the Xcode project
        working-directory: apple/Xcode
        run: xcodegen generate
      - name: Run UI tests
        env:
          # xcodebuild passes TEST_RUNNER_* to the test runner without the prefix.
          TEST_RUNNER_DISKINDEXER_BIN: ${{ github.workspace }}/diskindexer
        run: |
          xcodebuild test \
            -project apple/Xcode/DiskIndexer.xcodeproj \
            -scheme DiskIndexer \
            -destination 'platform=macOS' \
            -resultBundlePath build/UITests.xcresult
      - name: Upload test results (screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UITests.xcresult
          path: build/UITests.xcresult

  ios-app:
    name: iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history: the app's version and build number come from git.
          fetch-depth: 0
      - run: brew install xcodegen
      # Unsigned, for a device: AltStore signs it when it installs it. The SSH
      # transport itself is tested on macOS above.
      - name: Build the .ipa
        run: make ios-ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DiskIndexer-iOS
          path: build/DiskIndexer-iOS.ipa
