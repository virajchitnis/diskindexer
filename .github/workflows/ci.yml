name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile release binaries
        run: make build-linux build-darwin-arm64 build-darwin-amd64

  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version stamped into the app
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: swift --version
      # Unit tests plus AppModel integration tests against a real `diskindexer serve`.
      - run: make test-apple
      - run: make mac-app
      - uses: actions/upload-artifact@v4
        with:
          name: DiskIndexer-macOS
          path: build/DiskIndexer-macOS.zip
          if-no-files-found: error
